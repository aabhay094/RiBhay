<section class="max-w-6xl mx-auto px-6 py-16">
  <div class="reveal glass rounded-[2rem] p-10 md:p-16 text-center relative overflow-hidden">
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[28rem] h-64 rounded-full bg-neon/20 blur-[100px] pointer-events-none"></div>
    <h2 class="relative text-4xl md:text-6xl font-extrabold text-pearl">{{ site.cta_title }}</h2>
    <p class="relative mt-4 max-w-lg mx-auto">{{ site.cta_text }}</p>
    <a href="{% url 'core:contact' %}" class="relative btn btn-glow mt-8">{{ site.cta_button|default:"Say Hello" }} →</a>
  </div>
</section>
