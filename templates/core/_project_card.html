<a href="{% url 'core:project_detail' p.slug %}" class="reveal group glass rounded-3xl overflow-hidden flex flex-col {% if wide %}md:col-span-2{% endif %}">
  <div class="relative h-56 md:h-64 overflow-hidden v{{ p.variant }}">
    {% if p.image %}
      <img src="{{ p.image.url }}" alt="{{ p.title }}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
    {% else %}
      <div class="absolute inset-0 vgrid transition-transform duration-700 group-hover:scale-110"></div>
      <div class="absolute inset-0 flex items-center justify-center font-display font-extrabold text-8xl text-white/10 transition-transform duration-700 group-hover:scale-125">{{ p.title|slice:":1" }}</div>
    {% endif %}
    <span class="absolute top-4 left-4 pill !text-[.65rem]">{{ p.category }}</span>
    <span class="absolute top-4 right-4 w-9 h-9 rounded-full glass flex items-center justify-center text-pearl opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition">↗</span>
  </div>
  <div class="p-6">
    <h3 class="text-xl md:text-2xl font-extrabold text-pearl group-hover:text-neon2 transition">{{ p.title }}</h3>
    <p class="mt-2 text-sm leading-relaxed">{{ p.summary|truncatechars:170 }}</p>
    <div class="mt-5 flex flex-wrap gap-2">{% for t in p.tag_list %}<span class="tag">{{ t }}</span>{% endfor %}</div>
  </div>
</a>
